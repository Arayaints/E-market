services:
  mock-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: emarket-mock-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: test
      APP_MODE: mock
      PORT: 8080
      DB_DRIVER: sqlite
      # This path is mounted to a named Docker volume, so booking and
      # notification data survive restart/redeploy of the API container.
      DB_URL: /data/emarket-test.db
      JWT_SECRET: emarket-test-jwt-secret-2026
    volumes:
      - emarket_mock_data:/data

volumes:
  emarket_mock_data:
